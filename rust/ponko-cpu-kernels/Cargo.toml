[package]
name = "ponko-cpu-kernels"
version = "0.1.0"
edition = "2021"
description = "Independent CPU kernels for Ponko's Exynos 2400E inference path"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]
path = "src/lib.rs"

[features]
default = []
exynos2400e = []

[[bench]]
name = "matmul"
harness = false

[profile.release]
panic = "abort"
