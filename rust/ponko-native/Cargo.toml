[package]
name = "ponko-native"
version = "0.1.0"
edition = "2021"
description = "Ponko's Rust/UniFFI Android native facade for stable-diffusion.cpp"
license = "MIT"
build = "build.rs"

[lib]
name = "ponko_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
libloading = "0.8"
thiserror = "2"
uniffi = "=0.32.2"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]
