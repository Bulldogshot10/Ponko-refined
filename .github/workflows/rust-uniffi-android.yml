name: Ponko Rust-UniFFI Android APK

on:
  push:
    branches: [feat/rust-uniffi-native-facade]
  pull_request:
    branches: [feat/exynos2400e-vae-direct-conv-test]
    paths:
      - "app/**"
      - "rust/**"
      - "gradle/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - ".github/workflows/rust-uniffi-android.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ponko-rust-uniffi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Rust + UniFFI + C ABI + APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk and C++ compiler cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache clang libclang-dev
          cargo install cargo-ndk --locked
          rustc --version
          cargo --version
          cargo ndk --version
          ccache --version
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ccache
            app/build/ponko-cargo-target
          key: ${{ runner.os }}-ponko-rust-ndk-${{ hashFiles('rust/ponko-native/Cargo.toml', 'rust/ponko-native/Cargo.lock', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ponko-rust-ndk-

      - name: Install Android SDK and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..50} | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Format Rust facade
        id: format-rust
        run: cargo fmt --manifest-path rust/ponko-native/Cargo.toml --all

      - name: Test Rust facade
        id: test-rust
        run: cargo test --manifest-path rust/ponko-native/Cargo.toml

      - name: Build debug APK with Rust-UniFFI enabled
        id: assemble-apk
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p app/build
          ./gradlew --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee app/build/ponko-gradle-build.log

      - name: Verify APK includes all drawing libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libponko_native.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libponko_sd.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libstable-diffusion.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libc++_shared.so'
          if grep -Eq 'external fun native(Info|Create|Generate|Cancel|Free)' app/src/main/java/com/litertchat/app/draw/SdCppEngine.kt; then
            echo "Legacy direct JNI methods still exist in SdCppEngine.kt" >&2
            exit 1
          fi
          ccache -s

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponko-rust-uniffi-build-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/ponko-gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish queryable commit status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          RUST_TEST_OUTCOME: ${{ steps.test-rust.outcome }}
          APK_BUILD_OUTCOME: ${{ steps.assemble-apk.outcome }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            const description = ('rust=' + (process.env.RUST_TEST_OUTCOME || 'not-run') +
              ', apk=' + (process.env.APK_BUILD_OUTCOME || 'not-run')).slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: 'https://github.com/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
              description,
              context: 'ponko/rust-uniffi-apk'
            });
