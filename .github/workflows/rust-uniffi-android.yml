name: Ponko Rust-UniFFI Android APK

on:
  push:
    branches: [feat/rust-uniffi-native-facade]
    paths:
      - "app/**"
      - "rust/**"
      - "gradle/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - ".github/workflows/rust-uniffi-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ponko-rust-uniffi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Rust + UniFFI + C ABI + APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk and C++ compiler cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache clang libclang-dev
          cargo install cargo-ndk --locked
          rustc --version
          cargo --version
          cargo ndk --version
          ccache --version
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ccache
            app/build/ponko-cargo-target
          key: ${{ runner.os }}-ponko-rust-ndk-${{ hashFiles('rust/ponko-native/Cargo.toml', 'rust/ponko-native/Cargo.lock', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ponko-rust-ndk-

      - name: Install Android SDK and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..50} | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/ponko-native/Cargo.toml --all -- --check

      - name: Test Rust facade
        run: cargo test --manifest-path rust/ponko-native/Cargo.toml

      - name: Build debug APK with Rust-UniFFI enabled
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK includes all drawing libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libponko_native.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libponko_sd.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libstable-diffusion.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libc++_shared.so'
          if grep -Eq 'external fun native(Info|Create|Generate|Cancel|Free)' app/src/main/java/com/litertchat/app/draw/SdCppEngine.kt; then
            echo "Legacy direct JNI methods still exist in SdCppEngine.kt" >&2
            exit 1
          fi
          ccache -s

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ponko-rust-uniffi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
