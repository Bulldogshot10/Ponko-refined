name: Ponko Hearth Rust-UniFFI Android APK

on:
  push:
    branches:
      - feat/hearth-native-rewrite
      - feat/rust-uniffi-native-facade
    paths:
      - "app/**"
      - "rust/**"
      - "scripts/**"
      - ".gitmodules"
      - "gradle/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - ".github/workflows/rust-uniffi-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "rust/**"
      - ".gitmodules"
      - "gradle/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - ".github/workflows/rust-uniffi-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ponko-hearth-rust-vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Hearth + Burn/WGPU + UniFFI + APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/build/ponko-cargo-target
          key: ${{ runner.os }}-ponko-hearth-${{ hashFiles('rust/ponko-native/Cargo.toml', 'rust/ponko-native/Cargo.lock', 'rust/hearth/Cargo.toml', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-ponko-hearth-

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"

      - uses: gradle/actions/setup-gradle@v4

      - name: Patch CubeCL Android SPIR-V cache config
        run: bash scripts/patch-hearth-android.sh

      - name: Format and test Hearth adapter
        run: |
          cargo fmt --manifest-path rust/ponko-native/Cargo.toml --all
          cargo test --manifest-path rust/ponko-native/Cargo.toml

      - name: Build debug APK
        id: assemble-apk
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee app/build/ponko-gradle-build.log

      - name: Verify APK has no sd.cpp backend
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libponko_native.so'
          if unzip -l "$APK" | grep -Eq 'libponko_sd.so|libstable-diffusion.so'; then
            echo "Legacy sd.cpp libraries found in the Hearth APK." >&2
            exit 1
          fi


      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponko-hearth-vulkan-build-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/ponko-gradle-build.log
            app/build/generated/source/uniffi/main/java/**/*.kt
            rust/ponko-native/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
