name: Ponko Android APK (Hearth / Burn-WGPU Vulkan)

on:
  push:
    branches:
      - feat/hearth-native-rewrite
      - feat/rust-uniffi-native-facade
    paths:
      - "app/**"
      - "rust/ponko-native/**"
      - "scripts/**"
      - "rust/hearth/**"
      - ".gitmodules"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/ponko-app-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "rust/ponko-native/**"
      - "rust/hearth/**"
      - ".gitmodules"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/ponko-app-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ponko-hearth-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Build Ponko debug APK (Hearth Vulkan)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source and Hearth dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.3.13750724"
          } >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Patch CubeCL Android SPIR-V cache config
        run: bash scripts/patch-hearth-android.sh

      - name: Format and test Hearth adapter
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/ponko-native/Cargo.toml --all
          cargo test --manifest-path rust/ponko-native/Cargo.toml

      - name: Build APK with Hearth / WGPU Vulkan
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee app-build.log

      - name: Verify single Hearth native backend in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q "libponko_native.so" apk-contents.txt
          if grep -Eq "libponko_sd.so|libstable-diffusion.so" apk-contents.txt; then
            echo "Legacy sd.cpp libraries must not ship in the Hearth APK." >&2
            exit 1
          fi
          echo "Verified Hearth APK: $APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponko-hearth-vulkan-debug-apk-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-build.log
            apk-contents.txt
            apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
