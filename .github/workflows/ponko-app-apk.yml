name: Ponko Android APK (CPU / Exynos 2400E)

on:
  push:
    branches: [feat/rust-uniffi-native-facade]
    paths:
      - "app/**"
      - "rust/ponko-native/**"
      - "experiments/ponko-compute/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ponko-app-apk.yml"
      - "goal.md"
  pull_request:
    paths:
      - "app/**"
      - "rust/ponko-native/**"
      - "experiments/ponko-compute/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ponko-app-apk.yml"
      - "goal.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ponko-app-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Build Ponko debug APK (Vulkan OFF, Exynos 2400E CPU profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PONKO_ENABLE_VULKAN: OFF
      PONKO_EXYNOS_2400E_CPU_PROFILE: ON
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - name: Install Android SDK packages and ccache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.31.6"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.3.13750724"
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
          } >> "$GITHUB_ENV"
          ccache --version

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ponko-native-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', 'app/build.gradle.kts', 'rust/ponko-native/build.rs') }}
          restore-keys: |
            ponko-native-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Format and test Rust facade
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/ponko-native/Cargo.toml
          cargo test --manifest-path rust/ponko-native/Cargo.toml

      - name: Build CPU APK with Vulkan disabled and Exynos profile enabled
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PponkoEnableVulkan=OFF \
            -PponkoExynosCpuProfile=ON \
            2>&1 | tee app-build.log

      - name: Verify APK and packaged native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          for library in libponko_native.so libponko_sd.so libstable-diffusion.so libomp.so; do
            if ! grep -q "$library" apk-contents.txt; then
              echo "APK is missing required native library: $library" >&2
              exit 1
            fi
          done
          echo "Verified debug APK: $APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponko-cpu-exynos2400e-debug-apk-${{ github.run_id }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-build.log
            apk-contents.txt
            apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
